<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prototipo X</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- SCHERMATA TITOLO -->
  <section id="s-title" class="screen active">
    <div class="press" data-i18n="clickToStart">Click to start</div>
  </section>

  <!-- MENU PRINCIPALE -->
  <section id="s-menu" class="screen">
    <h1 class="logo">PROTOTIPO X</h1>
    <div class="menu">
      <button class="item" id="b-new"><span data-i18n="newGame">New Game</span><i class="line"></i></button>
      <button class="item" id="b-load"><span data-i18n="loadGame">Load Game</span><i class="line"></i></button>
      <button class="item" id="b-options"><span data-i18n="options">Options</span><i class="line"></i></button>
    </div>
  </section>

  <!-- AVVISO MOBILE (visibile solo se la versione mobile e' disattivata) -->
  <section id="s-mobile" class="screen">
    <div data-i18n="noMobile">Mobile version not available yet.<br>Please open the game on a computer.</div>
  </section>

  <!-- OPZIONI -->
  <section id="s-options" class="screen">
    <div class="win panel">
      <h2 data-i18n="options">Options</h2>

      <div class="row">
        <div class="lbl" data-i18n="language">Language</div>
        <div class="langs">
          <button class="btn" data-lang="en">English</button>
          <button class="btn" data-lang="it">Italiano</button>
        </div>
      </div>

      <div class="row">
        <div class="lbl" data-i18n="volume">Volume</div>
        <div class="vols">
          <div class="slider"><span class="name" data-i18n="vMaster">Master</span><input type="range" min="0" max="100" data-vol="master"><span class="val"></span></div>
          <div class="slider"><span class="name" data-i18n="vMusic">Music</span><input type="range" min="0" max="100" data-vol="music"><span class="val"></span></div>
          <div class="slider"><span class="name" data-i18n="vSfx">Effects</span><input type="range" min="0" max="100" data-vol="sfx"><span class="val"></span></div>
        </div>
      </div>

      <button class="btn" id="b-back" data-i18n="back">Back</button>
    </div>
  </section>

  <!-- MAPPA -->
  <section id="s-world" class="screen">
    <button class="back" id="w-menu" data-i18n="menu">&lsaquo; Menu</button>
    <svg id="world" viewBox="0 0 800 300"></svg>
    <div class="toast win" id="toast"></div>
  </section>

  <!-- COMBATTIMENTO -->
  <section id="s-battle" class="screen">
    <div class="b-top">
      <div class="b-ename" id="m-name"></div>
      <div class="bar mbar"><i id="m-hpbar"></i><span id="m-hptxt"></span></div>
      <div class="monster" id="m-art"></div>
    </div>
    <div class="win b-msg" id="b-msg"></div>
    <div class="b-bottom">
      <div class="win team">
        <div class="cap" data-i18n="team">Team</div>
        <div id="team"></div>
      </div>
      <div class="win cmds">
        <div id="cmd-main">
          <button class="item cmd" id="c-attack"><span data-i18n="attack">Attack</span><i class="line"></i></button>
          <button class="item cmd" id="c-flee"><span data-i18n="flee">Flee</span><i class="line"></i></button>
        </div>
        <div id="cmd-end" hidden>
          <button class="item cmd" id="c-continue"><span data-i18n="continue">Continue</span><i class="line"></i></button>
        </div>
      </div>
    </div>
  </section>

  <!-- Ordine di caricamento: testi, impostazioni, dati, regole, schermate, avvio -->
  <script src="js/i18n.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/data.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/screens.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
